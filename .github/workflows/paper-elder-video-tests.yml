name: Elder Video PAPER Tests

on:
  push:
    branches:
      - paper/elder-video-strategy

permissions:
  contents: read

jobs:
  paper-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "pandas==2.2.0"
      - name: Run Elder and PAPER isolation tests
        run: |
          python -m unittest -v tests.test_strategy_engine_elder_video
          python -m unittest -v tests.test_strategy_engine_elder_triple_screen
          python -m unittest -v test_paper_state_guard test_strategy_engine_v2_paper
